spring.application.name=SewaSutra

# ========================================
# Database Configuration (PostgreSQL)
# ========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sewasutra_db
spring.datasource.username=postgres
spring.datasource.password=anita
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.servlet.context-path=/api

# ========================================
# Redis Configuration
# ========================================
spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ========================================
# JWT Configuration
# ========================================
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000



# ========================================
# Payment Gateway Configuration
# ========================================
# eSewa
esewa.merchant.code=${ESEWA_MERCHANT_CODE:EPAYTEST}
esewa.secret.key=${ESEWA_SECRET_KEY:8gBm/:&EnhH.1/q}
esewa.base.url=${ESEWA_BASE_URL:https://uat.esewa.com.np/epay/main}
esewa.success.url=${ESEWA_SUCCESS_URL:http://localhost:8080/api/payments/esewa/callback}
esewa.failure.url=${ESEWA_FAILURE_URL:http://localhost:8080/api/payments/failure}

# Stripe
stripe.api.key=${STRIPE_API_KEY:your_stripe_secret_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:your_webhook_secret}
stripe.currency=NPR

# Platform Commission
app.payment.commission-percent=5
app.payment.min-transaction=1000
app.payment.max-transaction=500000

# ========================================
# AI & Vector Database Configuration
# ========================================
pinecone.api.key=${PINECONE_API_KEY:your_pinecone_api_key}
pinecone.environment=${PINECONE_ENV:us-west1-gcp}
pinecone.index.name=sewasutra-companies
pinecone.dimension=384

# AI Recommendation Settings
app.ai.recommendation-limit=10
app.ai.recommendation-cache-ttl=1800
app.ai.similarity-threshold=0.6

# ========================================
# Email Configuration
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Settings
app.email.from=no-reply@sewasutra.com
app.email.from-name=SewaSutra Platform

# ========================================
# File Upload Configuration
# ========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./uploads
file.upload.allowed-extensions=pdf,jpg,jpeg,png,doc,docx,xls,xlsx

# ========================================
# WebSocket Configuration
# ========================================
app.websocket.allowed-origins=http://localhost:3000,http://localhost:4200

# ========================================
# Logging Configuration
# ========================================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.demo=DEBUG

# ========================================
# JSON Configuration
# ========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=Asia/Kathmandu

# ========================================
# Security Configuration
# ========================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# ========================================
# Rate Limiting
# ========================================
app.rate-limit.login=5
app.rate-limit.registration=3
app.rate-limit.quote-submission=10
app.rate-limit.file-upload=20
